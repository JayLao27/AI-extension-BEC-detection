<!DOCTYPE html>
<html>
<head>
    <title>Phishing Detector</title>
    <link rel="stylesheet" type="text/css" href="popup.css">
</head>
<body>
    <div class="container">
        <h2>Phishing Detector</h2>

        <label for="modelSelect" class="model-label">Model</label>
        <select id="modelSelect" class="model-select">
            <option value="two_stage_bec">Two-Stage BEC Detection (Header XGBoost + Body KNN)</option>
            <option value="rf">RandomForest (rf_model.pkl)</option>
        </select>
        
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <button id="scanPageBtn" style="background-color: #ff9800; flex: 1;">Scan Current Page</button>
            <button id="resetBtn" style="background-color: #f44336; flex: 1;">Reset</button>
        </div>
        
        <p style="text-align: center; margin: 0 0 10px 0;">-- OR PASTE TEXT MANUALLY --</p>

        <div class="manual-inputs">
            <label for="inputSubject">Subject</label>
            <input id="inputSubject" type="text" placeholder="Paste the email subject here...">

            <label for="inputHeader">Header</label>
            <textarea id="inputHeader" rows="3" placeholder="Paste sender, recipient, date, or other header details here..."></textarea>

            <label for="inputBody">Body</label>
            <textarea id="inputBody" rows="6" placeholder="Paste the email body here..."></textarea>
        </div>
        
        <button id="analyzeBtn">Analyze Text</button>
        
        <div id="loader" class="hidden">Analyzing...</div>
        
        <div id="resultBox" class="hidden">
            <h3 id="resultStatus"></h3>
            <p id="confidenceLevel"></p>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
